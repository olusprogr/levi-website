<!-- Search Header -->
<div class="ss-search-header">
  <h1 class="ss-search-header__title">
    <span class="gradient-text">Produkte</span> suchen
  </h1>
  <p class="ss-search-header__sub">Finde das beste Angebot für dich</p>

  <!-- Search Input -->
  <div class="ss-search-bar">
    <svg class="ss-search-bar__icon" xmlns="http://www.w3.org/2000/svg"
         width="18" height="18" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input class="ss-search-bar__input"
           type="text"
           placeholder="Produktname eingeben…"
           [(ngModel)]="inputValue"
           (input)="onInputChange($event)"
           autocomplete="off"
           spellcheck="false">
  </div>
</div>

<!-- Results Grid -->
<section class="ss-grid" *ngIf="products.length > 0">
  <div class="ss-grid__inner">
    <a class="ss-product-card"
       *ngFor="let prod of products"
       [routerLink]="['/home/product', prod.name]">
      <div class="ss-product-card__img-wrap">
        <img class="ss-product-card__img-blur" [src]="prod.img" alt="" aria-hidden="true">
        <div class="ss-product-card__img-overlay"></div>
        <img class="ss-product-card__img" [src]="prod.img" [alt]="prod.name">
      </div>
      <div class="ss-product-card__body">
        <span class="ss-product-card__category badge-pill">
          {{ prod.categories?.[0] || 'Produkt' }}
        </span>
        <h2 class="ss-product-card__name">{{ prod.name }}</h2>
        <span class="ss-product-card__cta">
          Details anzeigen
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"/><path d="M12 5l7 7-7 7"/>
          </svg>
        </span>
      </div>
    </a>
  </div>
</section>

<!-- Empty State (after typing) -->
<div class="ss-empty" *ngIf="products.length === 0 && inputValue.length > 0">
  <svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="1.4"
       stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    <line x1="8" y1="8" x2="14" y2="14"/><line x1="14" y1="8" x2="8" y2="14"/>
  </svg>
  <p>Kein Produkt für <strong>"{{ inputValue }}"</strong> gefunden.</p>
</div>
