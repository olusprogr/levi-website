<div id="header">
  <div class="ss-product-loading" *ngIf="!currentProduct">
    <mat-spinner diameter="48"></mat-spinner>
    <p>Produkt wird geladen…</p>
  </div>

  <div class="ss-product" *ngIf="currentProduct">
  <div class="ss-product__inner">

    <!-- Image Panel -->
    <div class="ss-product__img-panel">
      <div class="ss-product__img-wrap">
        <img class="ss-product__img-blur"
             [src]="currentProduct['img']" alt="" aria-hidden="true">
        <div class="ss-product__img-overlay"></div>
        <img class="ss-product__img"
             [src]="currentProduct['img']"
             [alt]="currentProduct['name']">
      </div>
    </div>

    <!-- Info Panel -->
    <div class="ss-product__info">
      <!-- Category Badges -->
      <div class="ss-product__categories" *ngIf="currentProduct['categories']?.length">
        <span class="badge-pill" *ngFor="let cat of currentProduct['categories']">{{ cat }}</span>
      </div>

      <!-- Name -->
      <h1 class="ss-product__name">{{ currentProduct['name'] }}</h1>

      <!-- Stars (static) -->
      <div class="ss-product__stars">
        <span class="ss-product__star ss-product__star--filled" *ngFor="let s of [1,2,3,4]">★</span>
        <span class="ss-product__star">★</span>
        <span class="ss-product__reviews">4 Bewertungen</span>
      </div>

      <!-- Description -->
      <p class="ss-product__desc">{{ currentProduct['description'] }}</p>

      <!-- Price Row -->
      <div class="ss-product__price-row">
        <div class="ss-product__prices" *ngIf="currentProduct['discount']">
          <span class="ss-product__discount">{{ currentProduct['discount'] }}</span>
          <svg class="ss-product__arrow" xmlns="http://www.w3.org/2000/svg"
               width="18" height="18" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"/><path d="M12 5l7 7-7 7"/>
          </svg>
          <span class="ss-product__price">{{ currentProduct['price'] }}</span>
        </div>
        <div class="ss-product__prices" *ngIf="!currentProduct['discount']">
          <span class="ss-product__price">{{ currentProduct['price'] }}</span>
        </div>

        <!-- Actions -->
        <div class="ss-product__actions">
          <button class="ss-product__buy-btn" (click)="navigateToWebsite()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
              <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
            </svg>
            Jetzt kaufen
          </button>
          <button class="ss-product__wishlist-btn" aria-label="Merken">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
  </div>
</div>
