<div class="ss-login">
  <!-- Background Glow -->
  <div class="ss-login__glow ss-login__glow--1"></div>
  <div class="ss-login__glow ss-login__glow--2"></div>

  <!-- Card -->
  <div class="ss-login__card">
    <!-- Logo -->
    <div class="ss-login__logo-wrap">
      <div class="ss-login__logo">
        <div class="ss-logo__circle"></div>
        <div class="ss-logo__blob ss-logo__blob--1"></div>
        <div class="ss-logo__blob ss-logo__blob--2"></div>
        <div class="ss-logo__blob ss-logo__blob--3"></div>
      </div>
    </div>

    <h1 class="ss-login__title">Admin-Login</h1>
    <p class="ss-login__sub">Nur für autorisierte Nutzer</p>

    <!-- Form -->
    <form class="ss-login__form" (submit)="$event.preventDefault(); login()">
      <div class="ss-login__field">
        <label class="ss-login__label" for="fullname">Vollständiger Name</label>
        <div class="ss-login__input-wrap">
          <svg class="ss-login__input-icon" xmlns="http://www.w3.org/2000/svg"
               width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input id="fullname"
                 type="text"
                 class="ss-login__input"
                 [(ngModel)]="fullname"
                 name="fullname"
                 placeholder="Vor- und Nachname"
                 autocomplete="username"
                 required>
        </div>
      </div>

      <div class="ss-login__field">
        <label class="ss-login__label" for="password">Passwort</label>
        <div class="ss-login__input-wrap">
          <svg class="ss-login__input-icon" xmlns="http://www.w3.org/2000/svg"
               width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
          <input id="password"
                 type="password"
                 class="ss-login__input"
                 [(ngModel)]="password"
                 name="password"
                 placeholder="Passwort eingeben"
                 autocomplete="current-password"
                 required>
        </div>
      </div>

      <button class="ss-login__submit" type="submit">
        Anmelden
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"/><path d="M12 5l7 7-7 7"/>
        </svg>
      </button>
    </form>
  </div>
</div>
