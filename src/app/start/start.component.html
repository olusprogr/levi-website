<!-- Category Filter Chips -->
<div class="ss-filter">
  <div class="ss-filter__inner">
    <button class="ss-filter__chip"
            [class.ss-filter__chip--active]="activeButton === 1"
            (click)="toggleCetegory(1)">
      <span class="ss-filter__dot"></span> Neu
    </button>
    <button class="ss-filter__chip"
            [class.ss-filter__chip--active]="activeButton === 2"
            (click)="toggleCetegory(2)">
      <span class="ss-filter__dot"></span> Trending
    </button>
    <button class="ss-filter__chip"
            [class.ss-filter__chip--active]="activeButton === 3"
            (click)="toggleCetegory(3)">
      <span class="ss-filter__dot"></span> Best Seller
    </button>
    <button class="ss-filter__chip"
            [class.ss-filter__chip--active]="activeButton === 4"
            (click)="toggleCetegory(4)">
      <span class="ss-filter__dot"></span> Rabatt
    </button>
    <button class="ss-filter__chip"
            [class.ss-filter__chip--active]="activeButton === 5"
            (click)="toggleCetegory(5)">
      <span class="ss-filter__dot"></span> Preis-Leistung
    </button>
  </div>
</div>

<!-- Product Grid -->
<main class="ss-grid" *ngIf="isLoaded">
  <div class="ss-grid__inner">
    <a class="ss-product-card"
       *ngFor="let prod of products"
       [routerLink]="['/home/product', prod.name]">
      <!-- Image -->
      <div class="ss-product-card__img-wrap">
        <img class="ss-product-card__img-blur" [src]="prod.img" alt="" aria-hidden="true">
        <div class="ss-product-card__img-overlay"></div>
        <img class="ss-product-card__img" [src]="prod.img" [alt]="prod.name">
      </div>
      <!-- Content -->
      <div class="ss-product-card__body">
        <span class="ss-product-card__category badge-pill">
          {{ prod.categories?.[0] || 'Produkt' }}
        </span>
        <h2 class="ss-product-card__name">{{ prod.name }}</h2>
        <span class="ss-product-card__cta">
          Details anzeigen
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"/><path d="M12 5l7 7-7 7"/>
          </svg>
        </span>
      </div>
    </a>

    <!-- Empty State -->
    <div class="ss-empty" *ngIf="products.length === 0">
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <p>Keine Produkte in dieser Kategorie gefunden.</p>
    </div>
  </div>
</main>

<!-- Loading Spinner -->
<div class="ss-loading" *ngIf="!isLoaded">
  <mat-spinner diameter="48"></mat-spinner>
  <p class="ss-loading__text">Produkte werden geladen…</p>
</div>
